<div class="sidebar" [class.aberta]="sidebarService.aberta()">
  <!-- INÍCIO -->
  <div class="menu-item" routerLink="/home" routerLinkActive="ativo">
    <img src="/assets/home.png" />
    <span>Início</span>
  </div>

  <!-- FUNCIONÁRIOS -->
  <div class="menu-item" (click)="toggleMenu('funcionario')">
    <img src="/assets/funcionario.png" />
    <span>Funcionários</span>
    <span class="seta" [class.aberta]="menuAberto === 'funcionario'">▼</span>
  </div>

  <div class="submenu" [class.aberto]="menuAberto === 'funcionario'">
    <div
      class="submenu-item"
      (click)="abrirPagina('/funcionario/cadastro', 'funcionario:cadastrar')"
    >
      Cadastro
    </div>

    <div class="submenu-item" (click)="abrirPagina('/funcionario/listagem', 'funcionario:listar')">
      Listagem
    </div>
  </div>

  <!-- ACOLHIDOS -->
  <div class="menu-item" (click)="toggleMenu('acolhido')">
    <img src="/assets/acolhidos.png" />
    <span>Acolhidos</span>
    <span class="seta" [class.aberta]="menuAberto === 'acolhido'">▼</span>
  </div>

  <div class="submenu" [class.aberto]="menuAberto === 'acolhido'">
    <div class="submenu-item" (click)="abrirPagina('/acolhido/cadastro', 'acolhido:cadastrar')">
      Cadastro
    </div>
    <div class="submenu-item" (click)="abrirPagina('/acolhido/listagem', 'acolhido:listar')">
      Listagem
    </div>
  </div>

  <!-- MEDICAMENTOS -->
  <div class="menu-item" (click)="toggleMenu('medicamento')">
    <img src="/assets/medicamento.png" />
    <span>Medicamentos</span>
    <span class="seta" [class.aberta]="menuAberto === 'medicamento'">▼</span>
  </div>

  <div class="submenu" [class.aberto]="menuAberto === 'medicamento'">
    <div
      class="submenu-item"
      (click)="abrirPagina('/medicamento/cadastro', 'medicamento:cadastrar')"
    >
      Cadastro
    </div>
    <div class="submenu-item" (click)="abrirPagina('/medicamento/listagem', 'medicamento:listar')">
      Listagem
    </div>
    <div
      class="submenu-item"
      (click)="abrirPagina('/medicamento/administracao', 'medicamento:listar')"
    >
      Administração
    </div>
  </div>

  <!-- PRODUTOS -->
  <div class="menu-item" (click)="toggleMenu('produto')">
    <img src="/assets/produto.png" />
    <span>Produtos</span>
    <span class="seta" [class.aberta]="menuAberto === 'produto'">▼</span>
  </div>

  <div class="submenu" [class.aberto]="menuAberto === 'produto'">
    <div class="submenu-item" (click)="abrirPagina('/produto/cadastro', 'produto:cadastrar')">
      Cadastro
    </div>
    <div class="submenu-item" (click)="abrirPagina('/produto/listagem', 'produto:listar')">
      Listagem
    </div>
    <div class="submenu-item" (click)="abrirPagina('/produto/controle', 'produto:controle')">
      Controle
    </div>
  </div>

  <!-- PATRIMÔNIO -->
  <div class="menu-item" (click)="toggleMenu('patrimonio')">
    <img src="/assets/patrimonio.png" />
    <span>Patrimônio</span>
    <span class="seta" [class.aberta]="menuAberto === 'patrimonio'">▼</span>
  </div>

  <div class="submenu" [class.aberto]="menuAberto === 'patrimonio'">
    <div class="submenu-item" (click)="abrirPagina('/patrimonio/cadastro', 'patrimonio:cadastrar')">
      Cadastro
    </div>
    <div class="submenu-item" (click)="abrirPagina('/patrimonio/listagem', 'patrimonio:listar')">
      Listagem
    </div>
  </div>

  <!-- AGENDA -->
  <div class="menu-item" (click)="toggleMenu('agenda')">
    <img src="/assets/calendario.png" />
    <span>Agenda</span>
    <span class="seta" [class.aberta]="menuAberto === 'agenda'">▼</span>
  </div>

  <div class="submenu" [class.aberto]="menuAberto === 'agenda'">
    <div class="submenu-item" (click)="abrirPagina('/agenda/listagem', 'evento:listar')">
      Calendário
    </div>
    <div class="submenu-item" (click)="abrirPagina('/agenda/evento-cadastro', 'evento:cadastrar')">
      Novo Evento
    </div>
  </div>

  <!-- RELATÓRIOS -->
  <div class="menu-item" (click)="abrirPagina('/relatorio', 'relatorio:listar')">
    <img src="/assets/relatorio.png" />
    <span>Relatórios</span>
  </div>
</div>
